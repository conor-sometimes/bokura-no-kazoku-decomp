# splat config: Bokura no Kazoku (Japan), boot ELF SCPS_150.88.
# Segment boundaries come from the ELF's own section table (readelf -S).
# File offset = vram - 0xFF000 for every loaded section.
name: Bokura no Kazoku (Japan)
sha1: 621ffd58de52794eaa3d33885ba1288f36e19365
options:
  basename: SCPS_150.88
  target_path: disc/SCPS_150.88
  base_path: ..
  asm_path: asm
  src_path: src
  build_path: build
  asset_path: assets
  ld_script_path: build/SCPS_150.88.ld
  symbol_addrs_path: [config/symbol_addrs.txt, config/vtables.txt, config/rodata_syms.txt]   # vtables.txt: scripts/data_units.py --syms; rodata_syms.txt: tools/bk/dataconv.py
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt
  platform: ps2
  compiler: EEGCC
  gp_value: 0x2F36F0
  find_file_boundaries: False
  create_undefined_funcs_auto: True
  create_undefined_syms_auto: True
  disasm_unknown: True
  named_regs_for_c_funcs: False     # numeric registers in INCLUDE_ASM files (ee-as needs them)
  string_encoding: ASCII
  section_order: [".text", ".data", ".rodata", ".bss"]
  subalign: null
  ld_bss_is_noload: True
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False

